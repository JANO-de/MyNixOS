# Evaluate the flake on every push and pull request: all outputs, both hosts, and the formatting
# check (nixfmt + statix + deadnix). Nothing heavy is built.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate every flake output and both hosts
        run: nix flake check --no-build
      - name: Formatting, statix and deadnix
        run: nix build --no-link .#checks.x86_64-linux.formatting
